name: Aqi Ledger mirror

on:
  pull_request:
  push:
    branches:
      - feat/aqi-ledger-conversation-id

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Targeted tests
        run: npm test -- src/engines/provider-runtime/providerRuntimeOpenAiCompatibleAdapter.test.ts

      - name: Build
        run: npm run build
